<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Spark AI NLP engineering profile banner</title>
  <desc id="desc">Dark engineering banner with holographic and systems research aesthetic.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#050b16"/>
      <stop offset="35%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="lineBlue" x1="0" x2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="lineViolet" x1="0" x2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <g opacity="0.22" stroke="#1e3a5f" stroke-width="1">
    <path d="M60 50 L1140 50 M60 120 L1140 120 M60 190 L1140 190 M60 260 L1140 260 M60 330 L1140 330"/>
    <path d="M80 40 L80 360 M200 40 L200 360 M320 40 L320 360 M440 40 L440 360 M560 40 L560 360 M680 40 L680 360 M800 40 L800 360 M920 40 L920 360 M1040 40 L1040 360"/>
  </g>

  <g opacity="0.9">
    <circle cx="170" cy="90" r="6" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="250" cy="90" r="6" fill="#8b5cf6" filter="url(#glow)"/>
    <circle cx="330" cy="90" r="6" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="410" cy="90" r="6" fill="#8b5cf6" filter="url(#glow)"/>

    <circle cx="170" cy="210" r="6" fill="#8b5cf6" filter="url(#glow)"/>
    <circle cx="250" cy="210" r="6" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="330" cy="210" r="6" fill="#8b5cf6" filter="url(#glow)"/>
    <circle cx="410" cy="210" r="6" fill="#38bdf8" filter="url(#glow)"/>

    <circle cx="170" cy="330" r="6" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="250" cy="330" r="6" fill="#8b5cf6" filter="url(#glow)"/>
    <circle cx="330" cy="330" r="6" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="410" cy="330" r="6" fill="#8b5cf6" filter="url(#glow)"/>

    <path d="M170 90 L250 90 L330 90 L410 90 M170 210 L250 210 L330 210 L410 210 M170 330 L250 330 L330 330 L410 330" stroke="url(#lineBlue)" stroke-width="2" fill="none" opacity="0.9"/>
    <path d="M170 90 L170 210 L170 330 M250 90 L250 210 L250 330 M330 90 L330 210 L330 330 M410 90 L410 210 L410 330" stroke="url(#lineViolet)" stroke-width="2" fill="none" opacity="0.9"/>
  </g>

  <g opacity="0.72">
    <path d="M520 90 L720 90 L900 180 L1080 180" stroke="url(#lineBlue)" stroke-width="3" fill="none"/>
    <path d="M520 310 L720 310 L900 220 L1080 220" stroke="url(#lineViolet)" stroke-width="3" fill="none"/>

    <circle cx="520" cy="90" r="7" fill="#38bdf8"/>
    <circle cx="720" cy="90" r="7" fill="#8b5cf6"/>
    <circle cx="900" cy="180" r="7" fill="#38bdf8"/>
    <circle cx="1080" cy="180" r="7" fill="#8b5cf6"/>

    <circle cx="520" cy="310" r="7" fill="#8b5cf6"/>
    <circle cx="720" cy="310" r="7" fill="#38bdf8"/>
    <circle cx="900" cy="220" r="7" fill="#8b5cf6"/>
    <circle cx="1080" cy="220" r="7" fill="#38bdf8"/>
  </g>

  <g>
    <rect x="56" y="52" width="420" height="296" rx="18" fill="url(#panel)" stroke="#1d4ed8" stroke-opacity="0.45"/>
    <rect x="88" y="80" width="180" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.7"/>
    <text x="104" y="98" fill="#93c5fd" font-size="12" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2">RESEARCH PROTOTYPING</text>

    <text x="88" y="170" fill="#e5f3ff" font-size="56" font-weight="700" font-family="Segoe UI, Arial, sans-serif">SPARK AI</text>
    <text x="88" y="220" fill="#7dd3fc" font-size="34" font-weight="600" font-family="Segoe UI, Arial, sans-serif">NLP</text>

    <text x="88" y="268" fill="#cbd5e1" font-size="20" font-family="Segoe UI, Arial, sans-serif">
      Holographic Systems • AI Avatars • Resilient Computation
    </text>

    <text x="88" y="308" fill="#94a3b8" font-size="16" font-family="Segoe UI, Arial, sans-serif">
      C++ / Python / HLS / Research Validation
    </text>

    <g opacity="0.9">
      <rect x="88" y="328" width="112" height="28" rx="14" fill="#0b1325" stroke="#38bdf8"/>
      <text x="100" y="347" fill="#bae6fd" font-size="12" font-family="Segoe UI, Arial, sans-serif">SYSTEMS</text>

      <rect x="208" y="328" width="90" height="28" rx="14" fill="#0b1325" stroke="#8b5cf6"/>
      <text x="220" y="347" fill="#ddd6fe" font-size="12" font-family="Segoe UI, Arial, sans-serif">AI</text>

      <rect x="312" y="328" width="130" height="28" rx="14" fill="#0b1325" stroke="#22d3ee"/>
      <text x="324" y="347" fill="#cffafe" font-size="12" font-family="Segoe UI, Arial, sans-serif">RESEARCH</text>
    </g>
  </g>

  <g opacity="0.25">
    <line x1="940" y1="60" x2="940" y2="340" stroke="#38bdf8" stroke-width="2"/>
    <line x1="980" y1="60" x2="980" y2="340" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="1020" y1="60" x2="1020" y2="340" stroke="#38bdf8" stroke-width="2"/>
  </g>
</svg>
